name: Python validation

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Validate manual observation template
        run: python scripts/validate_ott_episodes.py data/ott_upload_manual_v0_2.csv
      - name: Revalidate snapshot without changing tracked data
        shell: pwsh
        run: python scripts/validate_v02.py --mode offline --limit 30 --output "$env:RUNNER_TEMP/tmdb_ci_check.csv"
